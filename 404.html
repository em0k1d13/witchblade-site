<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ошибка 404 — Страница заденаена</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0b0d10;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .error-container {
      text-align: center;
      max-width: 500px;
      padding: 45px 20px;
      background: #11141a;
      border: 1px solid #1e222b;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }
    .deny-icon {
      display: inline-block;
      width: 60px;
      height: 60px;
      line-height: 60px;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid #ef4444;
      color: #ef4444;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .error-code {
      font-size: 110px;
      font-weight: 900;
      line-height: 1;
      margin: 0;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }
    .error-title {
      font-size: 24px;
      margin: 15px 0 10px;
    }
    .error-message {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 30px;
      line-height: 1.5;
    }
    .btn-home {
      display: inline-block;
      background: #38bdf8;
      color: #0b0d10;
      text-decoration: none;
      padding: 14px 28px;
      font-weight: bold;
      border-radius: 6px;
      font-size: 15px;
    }
    .btn-home:hover {
      background: #0ea5e9;
    }
  </style>
</head>
<body>

  <div class="error-container">
    <div class="deny-icon">!</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Страница заденаена</h1>
    <p class="error-message">
      Похоже, эта руна исчезла или Рошан утащил страницу в своё логово. Убедитесь, что адрес введён правильно.
    </p>
    <a href="index.html" class="btn-home">Вернуться на главную</a>
  </div>

</body>
</html>
